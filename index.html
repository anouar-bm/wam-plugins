<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WAM Community Plugins — GUI Test Page</title>
  <style>
    :root {
      --bg: #fafafa;
      --panel: #ffffff;
      --border: #e2e2e2;
      --text: #1a1a1a;
      --muted: #767676;
      --primary: #0f9d8a;
      --primary-bg: #e5f7f4;
      --danger: #b3261e;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); }
    #sidebar { width: 320px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
    #searchBar { padding: 10px; border-bottom: 1px solid var(--border); }
    input#search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    #list { overflow-y: auto; flex: 1; padding: 6px; }
    .item { padding: 8px 10px; cursor: pointer; border-radius: 6px; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item:hover { background: #f1f1f1; }
    .item.active { background: var(--primary-bg); }
    .item .name { font-weight: 500; }
    .item .vendor { color: var(--muted); font-size: 12px; width: 100%; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 8px; background: #eee; color: var(--muted); }
    .badge.instrument { background: var(--primary-bg); color: var(--primary); }

    #main { flex: 1; overflow-y: auto; padding: 20px 24px; }
    #title { margin: 0 0 4px 0; }
    #subtitle { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    #urlRow { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; }
    #urlRow[hidden] { display: none; }
    #githubUrl { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: ui-monospace, monospace; color: var(--muted); background: var(--panel); }
    #urlRow button, #urlRow a { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--panel); color: var(--text); text-decoration: none; cursor: pointer; }
    #urlRow button:hover, #urlRow a:hover { background: #f1f1f1; }
    #status { color: var(--danger); margin-bottom: 10px; font-size: 13px; }
    #status:empty { display: none; }

    #controls { margin-bottom: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
    #controls[hidden] { display: none; }
    #hint { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    #fileRow { display: flex; gap: 10px; align-items: center; }

    #piano { margin-top: 10px; }

    #gui { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--panel); min-height: 60px; }
    #gui:empty::before { content: "Plugin GUI will render here."; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="searchBar"><input id="search" placeholder="Search plugins…"></div>
    <div id="list"></div>
  </div>
  <div id="main">
    <h2 id="title">Select a plugin</h2>
    <div id="subtitle">Loading plugin list…</div>
    <div id="urlRow" hidden>
      <input id="githubUrl" type="text" readonly>
      <button id="copyUrlBtn" type="button">Copy</button>
    </div>
    <div id="status"></div>
    <div id="controls" hidden>
      <div id="hint"></div>
      <div id="fileRow"></div>
      <div id="midiInputRow" hidden style="margin-bottom:6px;">
        <label for="midiInputSelect" style="font-size:12px;color:var(--muted);margin-right:6px;">MIDI Input</label>
        <select id="midiInputSelect" style="font-size:13px;padding:4px 6px;">
          <option value="none">None</option>
          <option value="piano" selected>On-screen Piano</option>
        </select>
      </div>
      <div id="piano" hidden></div>
    </div>
    <div id="gui"></div>
  </div>

  <script type="module">
    // Loading pattern follows github.com/Jempasam/SamWAMS/blob/main/docs/index.js:
    // talk to the WAM SDK directly (initializeWamHost + Module.createInstance/createGui)
    // instead of the mainline.i3s.unice.fr <wam-host>/<wam-plugin> web components, whose
    // wam-host only reads its children once at connectedCallback and can't handle a
    // dynamically swapped plugin.
    const WAM_SDK = "https://www.webaudiomodules.com/sdk/2.0.0-alpha.6/src/initializeWamHost.js";
    const PIANO_URL = "https://mainline.i3s.unice.fr/wam2/packages/simpleMidiKeyboard/index.js";
    const PAGES_BASE = "https://anouar-bm.github.io/wam-plugins/";
    const DEFAULT_SAMPLE_URL = new URL("assets/samples/02-XYLO1.mp3", window.location.href).href;
    const urlRow = document.getElementById("urlRow");
    const githubUrl = document.getElementById("githubUrl");
    const copyUrlBtn = document.getElementById("copyUrlBtn");
    copyUrlBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(githubUrl.value);
      copyUrlBtn.textContent = "Copied!";
      setTimeout(() => { copyUrlBtn.textContent = "Copy"; }, 1200);
    });

    // Sequencer Party (burns-audio) plugins expect a host-provided extension registry
    // (collaboration, userSetting, etc). They already guard on the sub-keys being present
    // (e.g. `if (window.WAMExtensions.userSetting.get)`), so an empty stub is enough —
    // this test page just doesn't implement those host features.
    window.WAMExtensions = window.WAMExtensions || {};

    // Plugin paths in plugins.json are relative to community/ (that's where the mirror lives).
    const COMMUNITY_BASE = new URL("community/", window.location.href);
    const res = await fetch(new URL("plugins.json", COMMUNITY_BASE));
    const plugins = await res.json();

    const list = document.getElementById("list");
    const subtitle = document.getElementById("subtitle");
    const search = document.getElementById("search");
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const controls = document.getElementById("controls");
    const hint = document.getElementById("hint");
    const fileRow = document.getElementById("fileRow");
    const midiInputRow = document.getElementById("midiInputRow");
    const midiInputSelect = document.getElementById("midiInputSelect");
    const piano = document.getElementById("piano");
    const guiHost = document.getElementById("gui");

    let audioContext = null;
    let hostGroupId = null;
    let playerSourceNode = null; // created once per <audio> element, reconnected across plugin loads
    let player = null;
    let currentInstance = null;
    let pianoConnectedTo = null; // instanceId currently receiving events from the piano
    const instanceCache = new Map(); // p.path -> instance; AudioWorklet processor names can only be registerProcessor'd once per AudioContext, so reselecting a plugin must reuse its instance instead of re-importing/re-creating it

    async function ensureHost() {
      if (audioContext) return;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const { default: initializeWamHost } = await import(WAM_SDK);
      [hostGroupId] = await initializeWamHost(audioContext, "community-test-page");
    }

    function render(items) {
      list.innerHTML = "";
      for (const p of items) {
        const isInstrument = (p.category || []).includes("Instrument");
        const el = document.createElement("div");
        el.className = "item";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = p.name;
        el.appendChild(name);

        const badge = document.createElement("span");
        badge.className = "badge" + (isInstrument ? " instrument" : "");
        badge.textContent = isInstrument ? "instrument" : "effect";
        el.appendChild(badge);

        const meta = document.createElement("div");
        meta.className = "vendor";
        meta.textContent = `${p.vendor} — ${p.path}`;
        el.appendChild(meta);

        el.addEventListener("click", () => load(p, el));
        list.appendChild(el);
      }
    }

    // Drives instruments with a real WAM MIDI-keyboard plugin (drag/glissando, sustain,
    // octave shift all handled by that plugin's own GUI) instead of a hand-rolled one —
    // same pattern SamWAMS/Pro54 use: piano.audioNode.connectEvents(target.instanceId).
    let pianoInstance = null;
    async function getPianoInstance() {
      if (pianoInstance) return pianoInstance;
      const { default: Piano } = await import(/* @vite-ignore */ PIANO_URL);
      pianoInstance = await Piano.createInstance(hostGroupId, audioContext);
      const gui = await pianoInstance.createGui();
      piano.appendChild(gui);
      return pianoInstance;
    }

    // Exclusive MIDI source selection — mirrors faustide's own MidiController
    // (src/ui/MidiController.ts): exactly one source drives the DSP at a time
    // (None / on-screen keyboard / one hardware device), switching detaches the
    // previous source first. Piano AND a hardware keyboard firing simultaneously
    // was producing doubled/conflicting note events on the same instance.
    let midiAccessObj = null;
    let activeHardwareInput = null; // currently wired MIDIInput, if any
    function forwardMidiBytes(bytes) {
      if (!currentInstance || !audioContext) return;
      currentInstance.audioNode.scheduleEvents({
        type: "wam-midi",
        time: audioContext.currentTime,
        data: { bytes },
      });
    }
    async function selectMidiInput(value) {
      if (pianoConnectedTo) {
        try { pianoInstance?.audioNode.disconnectEvents(pianoConnectedTo); } catch {}
        pianoConnectedTo = null;
      }
      if (activeHardwareInput) {
        activeHardwareInput.onmidimessage = null;
        activeHardwareInput = null;
      }
      piano.hidden = true;

      if (value === "piano") {
        const pianoPlugin = await getPianoInstance();
        if (currentInstance) {
          pianoPlugin.audioNode.connectEvents(currentInstance.audioNode.instanceId);
          pianoConnectedTo = currentInstance.audioNode.instanceId;
        }
        piano.hidden = false;
      } else if (value !== "none" && midiAccessObj) {
        const input = midiAccessObj.inputs.get(value);
        if (input) {
          input.onmidimessage = (e) => forwardMidiBytes(e.data);
          activeHardwareInput = input;
        }
      }
    }
    midiInputSelect.addEventListener("change", () => selectMidiInput(midiInputSelect.value));

    let midiInputRequested = false;
    async function initMidiInput() {
      if (midiInputRequested) return;
      midiInputRequested = true;
      if (!navigator.requestMIDIAccess) return; // dropdown just stays None/Piano-only
      try {
        midiAccessObj = await navigator.requestMIDIAccess();
        const refreshOptions = () => {
          Array.from(midiInputSelect.options).forEach((o) => {
            if (o.value !== "none" && o.value !== "piano") o.remove();
          });
          midiAccessObj.inputs.forEach((input) => {
            const opt = document.createElement("option");
            opt.value = input.id;
            opt.textContent = input.name;
            midiInputSelect.appendChild(opt);
          });
        };
        refreshOptions();
        midiAccessObj.onstatechange = () => {
          refreshOptions();
          if (activeHardwareInput && !Array.from(midiAccessObj.inputs.values()).includes(activeHardwareInput)) {
            midiInputSelect.value = "none";
            selectMidiInput("none");
          }
        };
      } catch {
        // access denied — dropdown just won't list hardware devices
      }
    }

    async function load(p, el) {
      document.querySelectorAll(".item.active").forEach(n => n.classList.remove("active"));
      el.classList.add("active");
      title.textContent = p.name;
      githubUrl.value = new URL(p.path, new URL("community/", PAGES_BASE)).href;
      urlRow.hidden = false;
      status.textContent = "Loading…";
      guiHost.innerHTML = "";
      controls.hidden = true;
      piano.hidden = true;
      midiInputRow.hidden = true;
      fileRow.innerHTML = "";
      currentInstance = null;
      if (player) player.pause();

      try {
        await ensureHost();
        if (audioContext.state === "suspended") await audioContext.resume();
        initMidiInput();

        let instance = instanceCache.get(p.path);
        if (!instance) {
          const moduleUrl = new URL(p.path, COMMUNITY_BASE).href;
          const { default: WamModule } = await import(/* @vite-ignore */ moduleUrl);
          instance = await WamModule.createInstance(hostGroupId, audioContext);
          instanceCache.set(p.path, instance);
        }
        currentInstance = instance;

        const isInstrument = (p.category || []).includes("Instrument");
        if (isInstrument) {
          hint.textContent = "Instrument — pick a MIDI Input source below to play it.";
          instance.audioNode.connect(audioContext.destination);

          midiInputRow.hidden = false;
          await selectMidiInput(midiInputSelect.value);
        } else {
          hint.textContent = "Effect — plays a default loop through it; choose your own audio file to swap it out.";

          player = document.createElement("audio");
          player.controls = true;
          player.loop = true;
          player.crossOrigin = "anonymous";
          player.src = DEFAULT_SAMPLE_URL;
          const fileInput = document.createElement("input");
          fileInput.type = "file";
          fileInput.accept = "audio/*";
          fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;
            player.src = URL.createObjectURL(file);
            playerSourceNode = audioContext.createMediaElementSource(player);
            playerSourceNode.connect(instance.audioNode);
            player.play();
          });
          fileRow.appendChild(fileInput);
          fileRow.appendChild(player);
          instance.audioNode.connect(audioContext.destination);
          playerSourceNode = audioContext.createMediaElementSource(player);
          playerSourceNode.connect(instance.audioNode);
          player.play().catch(() => {}); // autoplay can be blocked; the visible <audio> controls still let the user hit play
        }
        controls.hidden = false;

        const gui = await instance.createGui();
        guiHost.appendChild(gui);
        status.textContent = "";
      } catch (err) {
        console.error(err);
        status.textContent = "Failed to load " + p.path + ": " + (err?.message || err);
      }
    }

    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      render(plugins.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.vendor.toLowerCase().includes(q) ||
        (p.keywords || []).some(k => k.toLowerCase().includes(q))
      ));
    });

    subtitle.textContent = `${plugins.length} WAM plugins — click one to load it live.`;
    render(plugins);
  </script>
</body>
</html>
